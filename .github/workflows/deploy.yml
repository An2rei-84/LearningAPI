name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test --no-input
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: True
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: :memory:

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black==24.8.0

      - name: Run Black
        run: black --check .

      - name: Run Flake8
        run: flake8 . --max-line-length=119 --exclude=.git,__pycache__,.venv,*migrations*

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t lms-app:${{ github.sha }} .
          docker tag lms-app:${{ github.sha }} lms-app:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file and copy to server
        run: |
          cat > .env << ENVEOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}

          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0

          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}

          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=
          EMAIL_HOST_PASSWORD=
          DEFAULT_FROM_EMAIL=noreply@lms.local
          ENVEOF

          scp -i ~/.ssh/github_actions -r \
            docker-compose.yml \
            Dockerfile \
            requirements.txt \
            nginx.conf \
            .env \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/app/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/github_actions ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ~/app
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose ps
          ENDSSH

      - name: Health check
        run: |
          ssh -i ~/.ssh/github_actions ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -f http://localhost/health/ || exit 1"
